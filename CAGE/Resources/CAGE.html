const todayISO=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const defaultState=()=>({version:4,daily:{},workouts:{},gymStatus:{},appointments:{},tasks:{},habits:{},customFoods:[],hiddenFoods:[],settings:{stepsGoal:0,calorieGoal:0,waterGoal:0,workoutsGoal:0,proteinGoal:0,carbsGoal:0,fatGoal:0,displayName:'',intro:false}});
function loadState(){try{const raw=localStorage.getItem(STORE_KEY);if(!raw)return defaultState();const x=JSON.parse(raw);return {...defaultState(),...x,settings:{...defaultState().settings,...(x.settings||{})}}}catch(e){return defaultState()}}
let state=loadState();state.gymStatus=state.gymStatus||{};state.customFoods=Array.isArray(state.customFoods)?state.customFoods:[];state.hiddenFoods=Array.isArray(state.hiddenFoods)?state.hiddenFoods:[];let selectedDate=todayISO(),calendarCursor=new Date(selectedDate+'T12:00:00'),activeTab='dashboard',toastTimer=null,introTimer=null,nutritionTab='log',tempLabelImage='',ocrText='';
const $=s=>document.querySelector(s);
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(state));return true}catch(e){notify('Speichern fehlgeschlagen – bitte Speicherplatz prüfen.',true);return false}}
function ensureDay(date){if(!state.daily[date])state.daily[date]={steps:'',water:[],protein:'',carbs:'',fat:'',sleepHours:'',bedtime:'',wakeTime:'',sleepNote:'',foodEntries:[]};const d=state.daily[date];if(!Array.isArray(d.water))d.water=[];if(!Array.isArray(d.foodEntries))d.foodEntries=[];return d}
function ensureArray(obj,key){if(!Array.isArray(obj[key]))obj[key]=[];return obj[key]}
function escapeHTML(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function fmtDate(iso,opts={weekday:'long',day:'numeric',month:'long',year:'numeric'}){const d=new Date(iso+'T12:00:00');return new Intl.DateTimeFormat('de-DE',opts).format(d)}
function shortDate(iso){return fmtDate(iso,{day:'2-digit',month:'short',year:'numeric'})}
function shiftDate(iso,amount){const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+amount);return d.toISOString().slice(0,10)}
function monthName(d){return new Intl.DateTimeFormat('de-DE',{month:'long',year:'numeric'}).format(d)}
function num(v){const n=Number(v);return Number.isFinite(n)?n:0}
function waterTotal(date){return ensureDay(date).water.reduce((a,b)=>a+num(b.ml),0)}

function allFoods(){const hidden=new Set(state.hiddenFoods||[]);return [...FOOD_DB.filter(f=>!hidden.has(String(f.id))),(state.customFoods||[])];}
function hiddenStarterFoods(){const hidden=new Set(state.hiddenFoods||[]);return FOOD_DB.filter(f=>hidden.has(String(f.id)));}
function removeFoodFromLibrary(id){const custom=(state.customFoods||[]).some(f=>String(f.id)===String(id));if(custom){state.customFoods=state.customFoods.filter(f=>String(f.id)!==String(id));}else if(FOOD_DB.some(f=>String(f.id)===String(id))){if(!state.hiddenFoods.includes(String(id)))state.hiddenFoods.push(String(id));}save();}
function restoreFoodToLibrary(id){state.hiddenFoods=(state.hiddenFoods||[]).filter(x=>String(x)!==String(id));save();}
function foodById(id){return allFoods().find(f=>f.id===id)||null;}
function macroTotals(date){const d=ensureDay(date),entries=d.foodEntries||[];const total={protein:num(d.protein),carbs:num(d.carbs),fat:num(d.fat)};for(const e of entries){total.protein+=num(e.protein);total.carbs+=num(e.carbs);total.fat+=num(e.fat)}total.protein=Math.round(total.protein*10)/10;total.carbs=Math.round(total.carbs*10)/10;total.fat=Math.round(total.fat*10)/10;total.kcal=Math.round(total.protein*4+total.carbs*4+total.fat*9);return total;}
function addFoodEntry(food,grams,date=selectedDate){if(!food||!Number.isFinite(grams)||grams<=0){notify('Bitte eine gültige Grammzahl eingeben.',true);return false;}const factor=grams/100,d=ensureDay(date);d.foodEntries.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),foodId:food.id,name:food.name,grams,protein:Math.round(num(food.p)*factor*10)/10,carbs:Math.round(num(food.c)*factor*10)/10,fat:Math.round(num(food.f)*factor*10)/10,time:new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})});save();return true;}

function parseLabelNutrition(text){const clean=String(text||'').replace(/\s+/g,' ').replace(/,/g,'.');const read=(re)=>{const m=clean.match(re);return m?Number(m[1]):null;};return {protein:read(/(?:eiweiß|eiweiss|protein)\s*[:.]?\s*(\d{1,3}(?:\.\d+)?)\s*g\b/i),carbs:read(/kohlenhydrate\s*[:.]?\s*(\d{1,3}(?:\.\d+)?)\s*g\b/i),fat:read(/\bfett\s*[:.]?\s*(\d{1,3}(?:\.\d+)?)\s*g\b/i)};}
async function loadTesseract(){if(window.Tesseract)return window.Tesseract;if(window._cageTesseractPromise)return window._cageTesseractPromise;window._cageTesseractPromise=new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';script.onload=()=>resolve(window.Tesseract);script.onerror=()=>reject(new Error('OCR-Bibliothek konnte nicht geladen werden.'));document.head.appendChild(script)});return window._cageTesseractPromise;}
async function scanLabel(){if(!tempLabelImage){notify('Bitte zuerst ein Etikett-Foto auswählen.',true);return;}const status=$('#ocrStatus');if(status)status.textContent='OCR wird geladen … (Internetverbindung nötig)';try{const T=await loadTesseract();const worker=await T.createWorker('deu',1,{logger:m=>{if(status&&m.status==='recognizing text')status.textContent='Etikett wird gelesen: '+Math.round((m.progress||0)*100)+' %';}});const result=await worker.recognize(tempLabelImage);await worker.terminate();ocrText=result.data.text||'';const found=parseLabelNutrition(ocrText);for(const [name,value] of Object.entries(found)){const input=document.querySelector(`[data-label-field="${name}"]`);if(input&&value!==null)input.value=value;}const foundCount=Object.values(found).filter(x=>x!==null).length;if(status)status.textContent=foundCount===3?'Protein, Kohlenhydrate und Fett erkannt. Bitte Werte am Foto prüfen.':`OCR fertig. ${foundCount}/3 Werte erkannt – fehlende Werte bitte vom Etikett ablesen.`;const raw=$('#ocrText');if(raw){raw.textContent=ocrText;raw.hidden=!ocrText;}notify('Etikett wurde ausgelesen. Bitte kontrollieren.');}catch(err){if(status)status.textContent='Automatisches Lesen ging nicht. Trage die Werte bitte manuell vom Foto ein.';notify('OCR gerade nicht verfügbar. Manuelle Eingabe ist möglich.',true);}}

function addExercise(name){if(!name)return;let w=state.workouts[selectedDate]||(state.workouts[selectedDate]={type:'',title:'',exercises:[]});if(w.exercises.some(e=>e.name.toLowerCase()===name.toLowerCase())){notify('Diese Übung ist für den Tag bereits eingetragen.');return}w.exercises.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),name,sets:[{weight:'',reps:''},{weight:'',reps:''},{weight:'',reps:''}]});save();render();notify(name+' hinzugefügt.')}
function handleAction(btn){const a=btn.dataset.action;switch(a){case'replay-intro':openIntro();break;case'go-calendar':setTab('calendar');break;case'go-gym':setTab('gym');break;case'go-nutrition':setTab('nutrition');break;case'go-activity':setTab('stats');break;case'go-sleep':setTab('stats');break;case'go-habits':setTab('calendar');break;case'go-stats':setTab('stats');break;case'nutrition-tab':nutritionTab=btn.dataset.tabname||'log';render();break;case'add-food':openFoodModal(btn.dataset.foodId);break;case'close-modal':{const host=$('#modalHost');if(host)host.innerHTML='';break}case'remove-food-entry':{const d=ensureDay(selectedDate),idx=Number(btn.dataset.index);if(!Number.isInteger(idx)||idx<0||idx>=d.foodEntries.length)break;if(!confirm('Diesen Eintrag aus dem Tageslog löschen?'))break;d.foodEntries.splice(idx,1);save();render();notify('Lebensmittel aus dem Tageslog gelöscht.');break}case'remove-food':{const food=foodById(btn.dataset.foodId);if(!food)break;const isCustom=(state.customFoods||[]).some(f=>String(f.id)===String(food.id));const msg=isCustom?`"${food.name}" dauerhaft aus deiner eigenen Liste löschen? Bereits gespeicherte Tageslogs bleiben erhalten.`:`"${food.name}" aus deiner persönlichen Liste ausblenden? Du kannst es später wiederherstellen.`;if(!confirm(msg))break;removeFoodFromLibrary(food.id);render();notify(isCustom?'Eigenes Lebensmittel gelöscht.':'Lebensmittel aus deiner Liste ausgeblendet.');break}case'restore-food':{restoreFoodToLibrary(btn.dataset.foodId);render();notify('Lebensmittel wiederhergestellt.');break}case'scan-label':scanLabel();break;case'gym-attendance':{state.gymStatus=state.gymStatus||{};state.gymStatus[selectedDate]=btn.dataset.status;save();render();notify(btn.dataset.status==='done'?'Gym-Besuch markiert.':'Tag als nicht trainiert markiert.');break}case'select-date':setSelectedDate(btn.dataset.date);break;case'month-prev':calendarCursor.setMonth(calendarCursor.getMonth()-1);render();break;case'month-next':calendarCursor.setMonth(calendarCursor.getMonth()+1);render();break;case'month-today':calendarCursor=new Date();selectedDate=todayISO();render();break;case'day-prev':setSelectedDate(shiftDate(selectedDate,-1));break;case'day-next':setSelectedDate(shiftDate(selectedDate,1));break;case'day-today':setSelectedDate(todayISO());break;case'open-gym-date':setTab('gym');break;case'open-workout-date':setSelectedDate(btn.dataset.date);setTab('gym');break;case'add-exercise':addExercise($('#exerciseSelect').value);break;case'add-custom-exercise':{const n=prompt('Wie heißt die neue Übung?');if(n&&n.trim())addExercise(n.trim());break}case'remove-exercise':{const w=workoutFor(selectedDate);if(w){w.exercises.splice(Number(btn.dataset.index),1);if(!w.exercises.length)delete state.workouts[selectedDate];save();render();notify('Übung entfernt.')}break}case'add-set':{const e=workoutFor(selectedDate)?.exercises.find(x=>x.id===btn.dataset.exerciseId);if(e){e.sets.push({weight:'',reps:''});save();render()}break}case'remove-set':{const e=workoutFor(selectedDate)?.exercises.find(x=>x.id===btn.dataset.exerciseId);if(e&&e.sets.length>1){e.sets.splice(Number(btn.dataset.index),1);save();render()}else notify('Mindestens ein Satz bleibt bestehen.');break}case'add-water':{const d=ensureDay(selectedDate);d.water.push({ml:Number(btn.dataset.amount),time:new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})});save();render();notify('Wasser eingetragen.');break}case'remove-water':{const d=ensureDay(selectedDate);d.water.splice(Number(btn.dataset.index),1);save();render();break}case'delete-task':{state.tasks[selectedDate]=ensureArray(state.tasks,selectedDate).filter(t=>t.id!==btn.dataset.id);save();render();break}case'export':exportData();break}}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-tab]');if(nav){setTab(nav.dataset.tab);return}const btn=e.target.closest('[data-action]');if(btn){handleAction(btn);return}});
document.addEventListener('submit',e=>{const form=e.target.closest('form[data-form]');if(!form)return;e.preventDefault();const fd=new FormData(form),type=form.dataset.form;switch(type){case'settings':{const keys=['stepsGoal','calorieGoal','waterGoal','workoutsGoal','proteinGoal','carbsGoal','fatGoal'];for(const key of keys){const raw=String(fd.get(key)||'').trim();state.settings[key]=raw===''?0:Math.max(0,num(raw));}state.settings.displayName=String(fd.get('displayName')||'').trim().slice(0,32);save();render();notify('Einstellungen gespeichert.');break}case'appointment':{const title=String(fd.get('title')||'').trim();if(!title)return;ensureArray(state.appointments,selectedDate).push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),title,time:String(fd.get('time')||'')});save();render();notify('Termin gespeichert.');break}case'workout-meta':{let w=state.workouts[selectedDate]||(state.workouts[selectedDate]={type:'',title:'',exercises:[]});w.type=String(fd.get('type')||'');w.title=String(fd.get('title')||'').trim();save();render();notify('Trainingstag gespeichert.');break}case'exercise-sets':{const e=workoutFor(selectedDate)?.exercises.find(x=>x.id===form.dataset.exerciseId);if(!e)return;const count=e.sets.length;e.sets=e.sets.map((s,i)=>({weight:String(fd.get('weight'+i)||''),reps:String(fd.get('reps'+i)||'')}));save();render();notify('Sätze gespeichert.');break}case'macros':{const d=ensureDay(selectedDate);d.protein=String(fd.get('protein')||'');d.carbs=String(fd.get('carbs')||'');d.fat=String(fd.get('fat')||'');save();render();notify('Manuelle Makro-Ergänzung gespeichert.');break}case'food-add':{const food=foodById(form.dataset.foodId),grams=num(fd.get('grams'));if(addFoodEntry(food,grams)){const host=$('#modalHost');if(host)host.innerHTML='';render();notify('Lebensmittel zur Tagesbilanz hinzugefügt.')}break}case'custom-food':{const name=String(fd.get('name')||'').trim();if(!name)return;const food={id:'custom-'+(crypto.randomUUID?crypto.randomUUID():String(Date.now())),name,category:String(fd.get('category')||'Eigene Produkte'),p:num(fd.get('protein')),c:num(fd.get('carbs')),f:num(fd.get('fat'))};state.customFoods.push(food);save();render();notify('Eigenes Lebensmittel gespeichert.');break}case'label-food':{const name=String(fd.get('name')||'').trim(),food={id:'label-'+(crypto.randomUUID?crypto.randomUUID():String(Date.now())),name,category:'Etikett-Produkte',p:num(fd.get('protein')),c:num(fd.get('carbs')),f:num(fd.get('fat'))},grams=num(fd.get('grams'));state.customFoods.push(food);if(addFoodEntry(food,grams)){save();tempLabelImage='';render();notify('Etikett-Produkt gespeichert und Portion berechnet.')}break}case'calorie-goal':{state.settings.calorieGoal=Math.max(0,num(fd.get('goal')));save();render();notify('Vergleichswert gespeichert.');break}case'custom-water':{const ml=num(fd.get('ml'));if(ml<=0)return;ensureDay(selectedDate).water.push({ml,time:new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})});save();render();notify('Wasser eingetragen.');break}case'stat-metrics':{const d=ensureDay(selectedDate);d.steps=String(fd.get('steps')||'');d.stepsSource='manual';d.sleepHours=String(fd.get('hours')||'');d.bedtime=String(fd.get('bedtime')||'');d.wakeTime=String(fd.get('wakeTime')||'');state.settings.stepsGoal=Math.max(0,num(fd.get('goal')));save();render();notify('Tageswerte gespeichert.');break}case'steps':{const d=ensureDay(selectedDate);d.steps=String(fd.get('steps')||'');d.stepsSource='manual';state.settings.stepsGoal=Math.max(0,num(fd.get('goal')));save();render();notify('Aktivität gespeichert.');break}case'sleep':{const d=ensureDay(selectedDate);d.sleepHours=String(fd.get('hours')||'');d.bedtime=String(fd.get('bedtime')||'');d.wakeTime=String(fd.get('wakeTime')||'');d.sleepNote=String(fd.get('note')||'');save();render();notify('Schlaf gespeichert.');break}case'task':{const text=String(fd.get('text')||'').trim();if(!text)return;ensureArray(state.tasks,selectedDate).push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),text,done:false});save();render();notify('Aufgabe hinzugefügt.');break}}});

function filterFoodList(){const q=($('#foodSearch')?.value||'').toLocaleLowerCase('de-DE'),cat=$('#foodCategory')?.value||'Alle';document.querySelectorAll('#foodList [data-food-search]').forEach(el=>{el.hidden=!(el.dataset.foodSearch||'').includes(q)||!(cat==='Alle'||el.dataset.foodCategory===cat);});}
document.addEventListener('input',e=>{if(e.target.id==='foodSearch')filterFoodList();});
document.addEventListener('change',e=>{if(e.target.id==='foodCategory')filterFoodList();if(e.target.id==='labelPhoto'){const file=e.target.files?.[0];if(!file)return;if(!file.type.startsWith('image/')){notify('Bitte eine Bilddatei auswählen.',true);return;}const reader=new FileReader();reader.onload=()=>{tempLabelImage=String(reader.result||'');const preview=$('#labelPreview');if(preview){preview.src=tempLabelImage;preview.hidden=false;}const status=$('#ocrStatus');if(status)status.textContent='Foto bereit. Starte Etikett-OCR oder trage die Werte manuell ein.';};reader.readAsDataURL(file);}});

document.addEventListener('change',e=>{const h=e.target.closest('[data-habit]');if(h){state.habits[selectedDate]=state.habits[selectedDate]||{};state.habits[selectedDate][h.dataset.habit]=h.checked;save();render();return}const t=e.target.closest('[data-task]');if(t){const task=ensureArray(state.tasks,selectedDate).find(x=>x.id===t.dataset.task);if(task){task.done=t.checked;save();render()}return}});
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`CAGE-backup-${todayISO()}.json`;a.click();URL.revokeObjectURL(url);notify('Backup exportiert.')}
document.addEventListener('change',async e=>{if(e.target.id!=='importFile')return;const file=e.target.files?.[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!data||typeof data!=='object'||!data.daily||!data.workouts)throw new Error('Ungültiges Backup');if(!confirm('Das Backup ersetzt deine aktuellen Daten in diesem Browser. Fortfahren?'))return;state={...defaultState(),...data,gymStatus:data.gymStatus||{},customFoods:Array.isArray(data.customFoods)?data.customFoods:[],hiddenFoods:Array.isArray(data.hiddenFoods)?data.hiddenFoods:[],settings:{...defaultState().settings,...(data.settings||{})}};save();render();notify('Backup importiert.')}catch(err){notify('Backup konnte nicht gelesen werden.',true)}e.target.value=''});
render();
</script>

<script>
/* CAGE 1.4 — command deck, personal record radar, training focus and mobile install support.
   Uses the original CAGE storage key so existing local data is preserved. */
const CAGE_ORIGINAL_DASHBOARD = renderDashboard;
const CAGE_ORIGINAL_GYM = renderGym;
const CAGE_ORIGINAL_STATS = renderStats;

function cageFmt(n, digits=0){return Number(n||0).toLocaleString('de-DE',{maximumFractionDigits:digits,minimumFractionDigits:digits});}
function cageWeekStart(iso){const d=new Date(iso+'T12:00:00');const dow=(d.getDay()+6)%7;d.setDate(d.getDate()-dow);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function cageHasLog(date){const d=state.daily[date]||{};const w=state.workouts[date];return !!((w&&(w.type||(w.exercises||[]).length))||state.gymStatus?.[date]||d.steps!==''||d.sleepHours!==''||waterTotal(date)>0||(d.foodEntries||[]).length||d.protein!==''||d.carbs!==''||d.fat!=='');}
function cageLogStreak(){let n=0,day=todayISO();while(cageHasLog(day)&&n<365){n++;day=shiftDate(day,-1);}return n;}
function cageWeeklyRoute(){const start=cageWeekStart(todayISO()),names=['MO','DI','MI','DO','FR','SA','SO'];return names.map((name,i)=>{const date=shiftDate(start,i),w=workoutFor(date),st=state.gymStatus?.[date]||'open',label=w?.type||(st==='done'?'GYM':st==='missed'?'×':'—');return `<div class="cage-route-day ${st==='done'?'done':''} ${date===todayISO()?'today':''}"><b>${name}</b><span>${escapeHTML(label)}</span></div>`}).join('');}
function cageRecords(){const map=new Map();for(const date of Object.keys(state.workouts||{}).sort()){const w=state.workouts[date];for(const ex of (w?.exercises||[])){for(const set of (ex.sets||[])){const weight=num(set.weight),reps=num(set.reps);if(weight<=0||reps<=0)continue;const key=ex.name.toLowerCase();const old=map.get(key);const score=weight*reps;if(!old||weight>old.weight||(weight===old.weight&&reps>old.reps)){map.set(key,{name:ex.name,weight,reps,score,date});}}}}return [...map.values()].sort((a,b)=>b.score-a.score);}
function cageRecentExercise(name,beforeDate){const dates=Object.keys(state.workouts||{}).filter(d=>d<beforeDate).sort((a,b)=>b.localeCompare(a));for(const date of dates){const ex=(state.workouts[date]?.exercises||[]).find(x=>x.name.toLowerCase()===name.toLowerCase());if(ex){const sets=(ex.sets||[]).filter(s=>num(s.weight)>0&&num(s.reps)>0);if(sets.length)return {date,sets};}}return null;}
function cagePRBoard(limit=5){const records=cageRecords().slice(0,limit);if(!records.length)return '<div class="cage-empty">Deine Rekorde erscheinen automatisch, sobald du Gewichte und Wiederholungen speicherst.</div>';return records.map(r=>`<div class="cage-record-row"><div><strong>${escapeHTML(r.name)}</strong><small>${fmtDate(r.date,{day:'2-digit',month:'short'})} · ${r.reps} Wiederholungen</small></div><div class="cage-record-value">${cageFmt(r.weight,1)} kg</div></div>`).join('');}
function cageLogPercent(){const d=ensureDay(todayISO()),w=workoutFor(todayISO()),checks=[!!(w&&(w.type||(w.exercises||[]).length)||state.gymStatus?.[todayISO()]),!!((d.foodEntries||[]).length||d.protein!==''||d.carbs!==''||d.fat!==''),d.steps!=='',d.sleepHours!=='',waterTotal(todayISO())>0];return {done:checks.filter(Boolean).length,total:checks.length,pct:Math.round(checks.filter(Boolean).length/checks.length*100)};}
function cageCommandDeck(){const p=cageLogPercent(),streak=cageLogStreak(),weekStart=cageWeekStart(todayISO()),weekWorkouts=allWorkoutDates().filter(d=>d>=weekStart&&d<=todayISO()).length,records=cageRecords();let hint=p.done===0?'Starte mit einem kleinen Eintrag – dein Logbuch wartet.':p.done<p.total?'Dein Log ist unterwegs. Ergänze den nächsten Bereich, wenn es passt.':'Tageslog vollständig erfasst. Sauber dokumentiert.';return `<section class="cage-command"><div class="cage-command-head"><div><div class="cage-kicker">CAGE COMMAND DECK · JAPAN NIGHT</div><div class="cage-command-title">Dein Kurs. Dein Fortschritt.</div><div class="small muted" style="margin-top:5px">${escapeHTML(hint)}</div></div><span class="cage-signal"><i></i> SYSTEM ONLINE</span></div><div class="cage-mission-grid"><div class="cage-mission"><span class="mission-icon">⚓</span><b>${weekWorkouts} Gym-Tage</b><small>Diese Woche im Logbuch</small></div><div class="cage-mission"><span class="mission-icon">✦</span><b>${records.length} Rekorde</b><small>Automatisch erkannte Übungen</small></div><div class="cage-mission"><span class="mission-icon">▤</span><b>${streak} ${streak===1?'Tag':'Tage'}</b><small>Aktuelle Log-Streak</small></div><div class="cage-mission"><span class="mission-icon">◈</span><b>${p.done}/${p.total} Bereiche</b><small>Heute dokumentiert</small></div></div><div class="cage-progress"><span style="width:${p.pct}%"></span></div><div class="cage-inline-meta"><span>Tageslog-Fortschritt</span><b>${p.pct}%</b></div><div class="cage-week-route">${cageWeeklyRoute()}</div></section><div class="cage-quick-actions"><button data-action="go-gym">⚓ Training starten</button><button data-action="go-nutrition">＋ Essen eintragen</button><button data-action="go-stats">▥ Stats erfassen</button></div>`;}
function cageFeaturePanels(){const records=cageRecords(),workouts=allWorkoutDates(),last=workouts[0],recent=last?state.workouts[last]:null;return `<div class="cage-feature-grid"><section class="cage-feature-card"><div class="card-head"><div><div class="cage-kicker">RECORD RADAR</div><h3>Deine stärksten Einträge</h3><p>Persönliche Bestwerte aus deinen gespeicherten Sätzen – automatisch erkannt.</p></div><span class="tag">${records.length} PR${records.length===1?'':'s'}</span></div>${cagePRBoard(4)}<button class="mini-link" data-action="go-stats" style="margin-top:10px">Alle Statistiken öffnen ↗</button></section><section class="cage-feature-card"><div class="cage-kicker">LETZTES TRAINING</div><h3 style="margin-top:7px">${last?escapeHTML(recent?.type||'Training'):'Noch kein Training'}</h3><p>${last?fmtDate(last)+' · '+((recent?.exercises||[]).length)+' Übungen':'Dein erstes Training wird hier festgehalten.'}</p>${last?`<div style="font-size:25px;font-weight:850;margin:15px 0 5px;color:#f0bd77">${(recent?.exercises||[]).reduce((n,e)=>n+(e.sets||[]).length,0)} <span style="font-size:10px;color:#b7c4c8">SÄTZE</span></div><button class="btn secondary small-btn" data-action="open-workout-date" data-date="${last}">Einheit ansehen →</button>`:'<div class="cage-empty" style="margin-top:14px">Sobald du trainierst und deine Sätze speicherst, entsteht hier dein persönliches Logbuch.</div>'}</section></div>`;}

renderDashboard = function(){const html=CAGE_ORIGINAL_DASHBOARD();return html+cageCommandDeck()+cageFeaturePanels();};

function cageGymTools(){const session=state.cageSession,active=!!(session&&session.active),elapsed=active?Math.max(0,Math.floor((Date.now()-session.startedAt)/1000)):0,mins=Math.floor(elapsed/60),secs=elapsed%60;const prev=workoutFor(selectedDate);return `<div class="gym-command-strip"><section class="gym-tool-card"><div class="cage-kicker">SESSION CONTROL</div><h3>${active?'Training läuft':'Trainingsmodus'}</h3><p>${active?`Aktive Einheit · ${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`:'Starte deine Einheit und halte die Dauer automatisch fest.'}</p><div class="gym-tool-actions">${active?'<button class="btn secondary small-btn" data-action="end-session">✓ Einheit beenden</button>':'<button class="btn small-btn" data-action="start-session">⚓ Start</button>'}<button class="btn ghost small-btn" data-action="focus-toggle">⛶ Fokus</button></div></section><section class="gym-tool-card"><div class="cage-kicker">REST TIMER</div><h3>Pause zwischen Sätzen</h3><p>Wähle eine Pause. Der Timer bleibt auch beim Seitenwechsel sichtbar.</p><div class="gym-tool-actions"><button class="btn secondary small-btn" data-action="rest-start" data-seconds="60">60 s</button><button class="btn secondary small-btn" data-action="rest-start" data-seconds="90">90 s</button><button class="btn secondary small-btn" data-action="rest-start" data-seconds="120">120 s</button></div></section></div>`;}
function cageGymInsight(){const w=workoutFor(selectedDate),exercises=w?.exercises||[];let rows=[];for(const e of exercises){const previous=cageRecentExercise(e.name,selectedDate);if(previous){const best=previous.sets.reduce((a,b)=>num(b.weight)*num(b.reps)>num(a.weight)*num(a.reps)?b:a,previous.sets[0]);rows.push(`<div class="cage-record-row"><div><strong>${escapeHTML(e.name)}</strong><small>Letzte Einheit · ${fmtDate(previous.date,{day:'2-digit',month:'short'})}</small></div><div class="cage-record-value">${cageFmt(best.weight,1)} kg × ${best.reps}</div></div>`);}}
return `<section class="card section-gap"><div class="card-head"><div><div class="cage-kicker">TRAININGSVERGLEICH</div><div class="card-title">Dein letzter Stand pro Übung</div><div class="small muted">Zum Vergleichen – du entscheidest selbst, wie du heute trainierst.</div></div><span class="tag">SMART LOG</span></div>${rows.length?rows.join(''):'<div class="cage-empty">Sobald du Übungen an einem früheren Tag dokumentiert hast, zeigt CAGE hier automatisch deine letzten Gewichte und Wiederholungen als Vergleich.</div>'}</section>`;}
renderGym = function(){let html=CAGE_ORIGINAL_GYM();html=html.replace('<div class="grid two">',cageGymTools()+'<div class="grid two">');html+=cageGymInsight();return html;};
renderStats = function(){let html=CAGE_ORIGINAL_STATS();return html+`<section class="card section-gap"><div class="card-head"><div><div class="cage-kicker">PERSONAL RECORD RADAR</div><div class="card-title">Persönliche Bestwerte</div><div class="small muted">CAGE vergleicht alle gespeicherten Sätze und zeigt deine stärksten dokumentierten Leistungen.</div></div><span class="tag">AUTO</span></div>${cagePRBoard(10)}</section>`;};

function cageNotifySession(){notify('Training abgeschlossen – Dauer wurde gespeichert.');}
function cageUpdateDock(){let dock=document.getElementById('cageTimerDock');if(!dock){dock=document.createElement('div');dock.id='cageTimerDock';dock.className='cage-timer-dock';document.body.appendChild(dock);}const until=num(state.cageRestUntil),remaining=Math.max(0,Math.ceil((until-Date.now())/1000)),session=state.cageSession,active=!!(session&&session.active);if(!until&&!active){dock.classList.remove('show');dock.innerHTML='';return;}dock.classList.add('show');let html='';if(until>0)html+=`<div><small>REST TIMER</small><strong>${String(Math.floor(remaining/60)).padStart(2,'0')}:${String(remaining%60).padStart(2,'0')}</strong></div><button data-action="rest-stop">Stop</button>`;if(active){const elapsed=Math.max(0,Math.floor((Date.now()-session.startedAt)/1000));html+=`<div><small>TRAINING LÄUFT</small><strong>${String(Math.floor(elapsed/60)).padStart(2,'0')}:${String(elapsed%60).padStart(2,'0')}</strong></div><button data-action="go-gym">Gym öffnen</button>`;}dock.innerHTML=html;if(until>0&&remaining===0){state.cageRestUntil=0;save();dock.classList.remove('show');dock.innerHTML='';notify('Pause beendet – weiter, wenn du bereit bist.');}}
function cageStartRest(seconds){state.cageRestUntil=Date.now()+Math.max(10,seconds)*1000;save();cageUpdateDock();notify(`Pause gestartet: ${seconds} Sekunden.`);}
function cageStartSession(){if(state.cageSession?.active){notify('Eine Trainingseinheit läuft bereits.');return;}state.cageSession={active:true,date:selectedDate,startedAt:Date.now()};save();cageUpdateDock();render();notify('Trainingseinheit gestartet.');}
function cageEndSession(){const s=state.cageSession;if(!s?.active)return;const duration=Math.max(0,Math.round((Date.now()-s.startedAt)/60000));const w=state.workouts[s.date]||(state.workouts[s.date]={type:'',title:'',exercises:[]});w.sessionMinutes=duration;state.gymStatus=state.gymStatus||{};state.gymStatus[s.date]='done';state.cageSession={active:false,date:s.date,startedAt:s.startedAt,endedAt:Date.now(),duration};save();document.body.classList.remove('cage-focus');cageUpdateDock();render();cageNotifySession();}

handleAction=function(btn){const a=btn.dataset.action;switch(a){case'start-session':cageStartSession();return;case'end-session':cageEndSession();return;case'rest-start':cageStartRest(Number(btn.dataset.seconds)||90);return;case'rest-stop':state.cageRestUntil=0;save();cageUpdateDock();notify('Timer gestoppt.');return;case'focus-toggle':document.body.classList.toggle('cage-focus');btn.textContent=document.body.classList.contains('cage-focus')?'⛶ Fokus beenden':'⛶ Fokus';return;case'install-app':if(cageInstallPrompt){cageInstallPrompt.prompt();cageInstallPrompt.userChoice.then(()=>{cageInstallPrompt=null;}).catch(()=>{});}else cageInstallFallback();return;default:CAGE_OLD_HANDLE_ACTION(btn);}};

// Keep the rest timer/session chip alive while navigating between tabs.
cageUpdateDock();setInterval(cageUpdateDock,1000);
render();
</script>

 if(type==='Upper')return upper;if(type==='Lower')return lower;if(type==='Arme')return arms;if(type==='Ganzkörper')return [...upper,...lower,...arms];return [...upper,...lower,...arms];
}

function cageFoodDatabaseMatch(query){
 const q=String(query||'').toLocaleLowerCase('de-DE');
 const aliases=[['haferflocken',['haferflocken','oats']],['chicken-raw',['hähnchenbrust roh','hähnchenbrust','huhn']],['chicken-cooked',['hähnchenbrust gegart','gegartes huhn']],['rice-cooked',['reis gekocht','gekochter reis']],['rice-dry',['reis trocken','basmatireis']],['quark',['magerquark','quark']],['skyr',['skyr']],['egg',['ei','eier']],['banana',['banane','bananen']],['apple',['apfel','äpfel']],['potato',['kartoffel','kartoffeln']],['pasta-cooked',['nudeln gekocht','gekochte nudeln']],['tuna-water',['thunfisch']],['salmon',['lachs']],['wholebread',['vollkornbrot']],['milk-15',['milch 1,5','milch']]];
 if(/cheese.?burger|cheeseburger/.test(q))return {item:true,name:"McDonald's Cheeseburger (Schätzwert)",p:16,c:30,f:13,grams:1,unit:'Stück',approx:true};
 for(const [id,words] of aliases){if(words.some(word=>q.includes(word))){const f=allFoods().find(x=>x.id===id)||FOOD_DB.find(x=>x.id===id);if(f)return {item:false,food:f};}}
 const sorted=allFoods().filter(f=>f&&f.name).slice().sort((a,b)=>String(b.name||'').length-String(a.name||'').length);
 const found=sorted.find(f=>q.includes(f.name.toLocaleLowerCase('de-DE')));
 return found?{item:false,food:found}:null;
}
function cageParseFoodQuestion(query){
 const q=String(query||'').trim();if(!q)return null;
 const match=cageFoodDatabaseMatch(q);if(!match)return null;
 const quantityMatch=q.match(/(\d+(?:[.,]\d+)?)\s*(kg|g|gramm|gram|stück|stk)?/i);
 let amount=quantityMatch?Number(quantityMatch[1].replace(',','.')):null;
 let grams=100,unit='g',p=0,c=0,f=0,name='';
 if(match.item){const count=amount&&(!quantityMatch[2]||/stück|stk/i.test(quantityMatch[2]))?Math.max(1,amount):1;grams=count;unit=count===1?'Stück':'Stück';p=match.p*count;c=match.c*count;f=match.f*count;name=match.name;}
 else {if(!amount)amount=100;const u=(quantityMatch?.[2]||'g').toLowerCase();grams=u==='kg'?amount*1000:/stück|stk/.test(u)?amount*100:amount;unit='g';name=match.food.name;const factor=grams/100;p=match.food.p*factor;c=match.food.c*factor;f=match.food.f*factor;}
 return {name,grams,unit,protein:Math.round(p*10)/10,carbs:Math.round(c*10)/10,fat:Math.round(f*10)/10,approx:!!match.approx,sourceQuery:q};
}

 for(let i=0;i<42;i++){
  let n=i-offset+1,dt,inside=true;
  if(n<1)dt=new Date(y,m-1,prevDays+n);else if(n>days){dt=new Date(y,m+1,n-days);inside=false;}else dt=new Date(y,m,n);
  const iso=`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
  const marks=marksFor(iso),wk=workoutFor(iso),status=state.gymStatus?.[iso]||'open',training=wk?.type||((wk?.exercises||[]).length?'Gym':'');
  const label=status==='rest'?'Rest Day':status==='done'?'Gym':status==='missed'?'Nicht gegangen':training;
  const icon=status==='done'?'✓':status==='missed'?'×':status==='rest'?'☾':training?'○':'';
  cells+=`<button class="calendar-day ${inside?'':'outside'} ${iso===selectedDate?'selected':''} ${iso===todayISO()?'today':''} ${status}" data-action="select-date" data-date="${iso}"><span class="day-number">${dt.getDate()}</span>${label?`<span class="calendar-training ${status}"><span>${cageEsc(label)}</span><b>${icon}</b></span>`:''}<span class="dots">${marks.map(x=>`<i class="dot ${x}"></i>`).join('')}</span></button>`;
 }
 const day=ensureDay(selectedDate),wk=workoutFor(selectedDate),apps=state.appointments[selectedDate]||[],mac=macroTotals(selectedDate),status=state.gymStatus?.[selectedDate]||'open';
 const gymLine=wk?.type||wk?.exercises?.length?`<b class="small">${cageEsc(wk.type||'Training')} · ${(wk.exercises||[]).length} Übungen</b><div class="small muted">${(wk.exercises||[]).map(e=>cageEsc(e.name)).join(' · ')||'Training ist geplant – Übungen noch nicht eingetragen.'}</div>`:'<div class="small muted">Für diesen Tag ist noch kein Training eingetragen.</div>';
 return `<div class="calendar-layout"><section class="card"><div class="card-head"><div><div class="card-title" style="font-size:17px">${monthName(calendarCursor)}</div><div class="small muted">Tippe einen Tag an, um sein Tageslog zu öffnen.</div></div><div class="row"><button class="btn ghost small-btn" data-action="month-prev">‹</button><button class="btn ghost small-btn" data-action="month-today">Heute</button><button class="btn ghost small-btn" data-action="month-next">›</button></div></div><div class="calendar-grid">${['MO','DI','MI','DO','FR','SA','SO'].map(x=>`<div class="weekday">${x}</div>`).join('')}${cells}</div><div class="calendar-legend"><span><i class="legend-dot" style="background:#f0b96e"></i>Gym geplant</span><span><i class="legend-dot" style="background:#8fe0ad"></i>Trainiert</span><span><i class="legend-dot" style="background:#f18d87"></i>Nicht gegangen</span><span><i class="legend-dot" style="background:#61cfff"></i>Rest Day</span></div></section>
 <section class="card day-panel"><div class="card-head"><div><div class="eyebrow">AUSGEWÄHLTER TAG</div><div class="card-title" style="font-size:17px;margin-top:5px">${fmtDate(selectedDate)}</div></div><span class="tag">${selectedDate===todayISO()?'HEUTE':'TAGESLOG'}</span></div><div class="row spread"><button class="btn ghost small-btn" data-action="day-prev">← Vorheriger</button><button class="btn ghost small-btn" data-action="day-next">Nächster →</button></div>
 <div class="day-section"><div class="day-section-title">✦ Gym / Rest Day</div>${gymLine}<div class="row wrap" style="margin-top:10px"><button class="btn small-btn ${status==='done'?'':'secondary'}" data-action="gym-attendance" data-status="done">✓ Gym gegangen</button><button class="btn small-btn ${status==='rest'?'':'ghost'}" data-action="gym-attendance" data-status="rest">☾ Rest Day</button><button class="btn small-btn ${status==='missed'?'danger':'ghost'}" data-action="gym-attendance" data-status="missed">× Nicht gegangen</button></div><div style="margin-top:8px"><button class="mini-link" data-action="open-gym-date">Training für diesen Tag öffnen ↗</button></div></div>
 <div class="day-section"><div class="day-section-title">◉ Makros</div><div class="day-line"><span>Protein / Carbs / Fett</span><b>${mac.protein} / ${mac.carbs} / ${mac.fat} g</b></div><div class="day-line"><span>Energie</span><b>${mac.kcal} kcal</b></div><div class="day-line"><span>Wasser</span><b>${waterTotal(selectedDate)} ml</b></div><button class="mini-link" data-action="go-nutrition">Makros öffnen ↗</button></div>
 <div class="day-section"><div class="day-section-title">⌁ Tageswerte</div><div class="day-line"><span>Schritte</span><b>${day.steps?num(day.steps).toLocaleString('de-DE'):'0'}</b></div><div class="day-line"><span>Schlaf</span><b>${day.sleepHours?cageEsc(day.sleepHours)+' Std.':'0 Std.'}</b></div><button class="mini-link" data-action="go-stats">Stats für diesen Tag bearbeiten ↗</button></div>
 <div class="day-section"><div class="day-section-title">▦ Termine</div>${apps.length?apps.map(a=>`<div class="day-line"><span>${cageEsc(a.time||'')}</span><b>${cageEsc(a.title)}</b></div>`).join(''):'<div class="small muted">Keine Termine eingetragen.</div>'}</div></section></div>
 <div class="card section-gap"><div class="card-head"><div><div class="card-title">Termin zu ${shortDate(selectedDate)} hinzufügen</div><div class="small muted">Der Termin erscheint automatisch im Kalender.</div></div></div><form data-form="appointment" class="form-grid"><div class="field"><label>Titel</label><input name="title" required placeholder="z. B. Training, Arzt, Schule"></div><div class="field"><label>Uhrzeit (optional)</label><input name="time" type="time"></div><div class="form-actions" style="grid-column:1/-1"><button class="btn" type="submit">+ Termin speichern</button></div></form></div>`;
}
renderCalendar=cageRenderCalendar;

// Update the default profile label to the exact spelling requested.
document.addEventListener('DOMContentLoaded',()=>{const p=document.getElementById('profileName');if(p)p.textContent='Hamed';});
render();
</script>

</body></html>
