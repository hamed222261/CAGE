
name: CAGE iOS Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4

      - name: Xcode Version
        run: xcodebuild -version

      - name: CAGE Build
        run: |
          set -o pipefail
          xcodebuild \
            -project CAGE.xcodeproj \
            -scheme CAGE \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee xcodebuild.log
